<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon slot="icon-only" name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>
      <div class="toolbar-brand">
        <img src="assets/icon/ic-ogmentorid-logo.png" alt="OpenKeyID" class="toolbar-brand-logo" width="26" height="26" />
        <span class="toolbar-brand-name">OpenKeyID</span>
      </div>
    </ion-title>

  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="result-content" #resultContent [scrollEvents]="true" (ionScroll)="onContentScroll()">
  <!-- Sticky Layer Tabs -->
  <div class="layer-tabs" *ngIf="assessmentOutcome?.layerOutcomes?.length">
    <div class="layer-tabs-inner">
      <div class="layer-tabs-group">
        <button
          *ngFor="let layer of assessmentOutcome!.layerOutcomes; let i = index"
          class="layer-tab"
          [class.active]="activeTabIndex === i"
          (click)="scrollToLayer(i)">
          Layer {{ i + 1 }}
        </button>
      </div>
      <button (click)="downloadPdf()" [disabled]="isLoading" class="download-btn">
        <ion-icon name="download-outline"></ion-icon>
        Download PDF
      </button>
    </div>
  </div>

  <ng-container *ngFor="let layer of assessmentOutcome?.layerOutcomes; let i = index">
    <div [id]="'layer-' + i">
      <ng-container [ngSwitch]="layer.layerType">
        <app-trait-list-outcome *ngSwitchCase="AssessmentLayerType.TRAIT_LIST"
          [outcome]="traitListOutcome">
        </app-trait-list-outcome>
        <app-big-trait-outcome *ngSwitchCase="AssessmentLayerType.BIG_FIVE_PERSONALITY_TRAIT"
          [outcome]="bigFiveOutcome"
          [layerOutcome]="bigFiveLayerOutcome">
        </app-big-trait-outcome>
      </ng-container>
    </div>
  </ng-container>

  <!-- CTA Banner -->
  <div class="hire-cta-wrapper">
    <div class="hire-cta">
      <div>
        <p class="hire-cta-text">Ready to hire your new team member?</p>
        <p class="hire-cta-sub">Setup a meeting with Ogmentor today!</p>
        <a
          class="hire-cta-btn"
          href="https://hello.ogmentor.com/discovery"
          target="_blank"
          rel="noopener noreferrer">
          Book a Meeting with Ogmentor
        </a>
      </div>

    </div>
  </div>
</ion-content>
